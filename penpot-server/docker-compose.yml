x-flags: &penpot-flags
  PENPOT_FLAGS: disable-email-verification enable-prepl-server disable-registration enable-oidc-registration enable-login-with-oidc secure-session-cookies

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: ${PENPOT_URI}

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 367001600
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

x-secret-key: &penpot-secret-key
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY}

networks:
  penpot-network:
    name: penpot_default
    external: false

  proxy-bridge:
    name: proxy_bridge
    external: true

volumes:
  penpot-db:
    name: penpot_db
  penpot-assets:
    name: penpot_assets

services:
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-latest}"
    container_name: penpot_frontend
    restart: always
    depends_on:
      - penpot-backend
      - penpot-exporter
    environment:
      <<: [*penpot-flags, *penpot-http-body-size]
    volumes:
      - penpot-assets:/opt/data/assets
    networks:
      - penpot-network
      - proxy-bridge

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-latest}"
    container_name: penpot_backend
    restart: always
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-valkey:
        condition: service_healthy
    environment:
      <<:
        [
          *penpot-flags,
          *penpot-public-uri,
          *penpot-http-body-size,
          *penpot-secret-key,
        ]
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PWD}
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: false
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_OIDC_CLIENT_ID: ${PENPOT_OIDC_CLIENT_ID}
      PENPOT_OIDC_BASE_URI: ${PENPOT_OIDC_BASE_URI}
      PENPOT_OIDC_CLIENT_SECRET: ${PENPOT_OIDC_CLIENT_SECRET}
    volumes:
      - penpot-assets:/opt/data/assets
    networks:
      - penpot-network

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-latest}"
    container_name: penpot_exporter
    restart: always
    depends_on:
      penpot-valkey:
        condition: service_healthy
    environment:
      <<: [*penpot-secret-key]
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks:
      - penpot-network

  penpot-postgres:
    image: "postgres:15"
    container_name: penpot_postgres
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${PENPOT_DB_PWD}
    volumes:
      - penpot-db:/var/lib/postgresql/data
    networks:
      - penpot-network

  penpot-valkey:
    image: valkey/valkey:8.1
    container_name: penpot_valkey
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu
    networks:
      - penpot-network
